[workspace]
resolver = "3"
members = ["runtime", "proto", "sdk", "kernel", "agents/counter", "agents/tally"]
# The SDK, kernel, and agents only link for wasm32, so plain `cargo build` / `cargo test` cover the runtime.
default-members = ["runtime"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[profile.release]
opt-level = 3
