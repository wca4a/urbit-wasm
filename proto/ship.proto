// Messages exchanged between the runtime, the kernel, and agents.
//
// Evolution rule: fields are only ever added. A field number is never reused or given a new
// meaning, and a new field must be safe for an old reader to ignore and for a new reader to
// find absent. Anything else gets a new message or interface name.
syntax = "proto3";

package ship.v1;

enum Kind {
  KIND_UNSPECIFIED = 0;
  // Changes state. Runs as its own event and transaction.
  KIND_COMMAND = 1;
  // Returns data and cannot change anything.
  KIND_READ = 2;
  // Tells an agent that a log it follows has new entries. Carries no payload: the agent asks
  // for the entries. Runs as its own event, like a command.
  KIND_NOTIFY = 3;
  // Asks an agent for the present state behind one of its logs, so that old entries can be
  // dropped. The payload is the log's name. The agent can only read while answering.
  KIND_CHECKPOINT = 4;
}

// Who is asking.
message Source {
  // The ship's owner, through a client or the runtime's API.
  bool owner = 1;
  // Otherwise, the local agent making the request.
  string agent = 2;
}

// What an agent is told about the call it is handling.
message Invocation {
  Kind kind = 1;
  string interface = 2;
  Source source = 3;
}

// Permission to use one interface of one agent.
message Grant {
  string agent = 1;
  string interface = 2;
}

message Provide {
  string interface = 1;
  // Any agent on the ship may use a public interface without declaring it.
  bool public = 2;
}

message Use {
  string agent = 1;
  string interface = 2;
  bool read = 3;
  bool send = 4;
}

// What an agent offers and what it needs. Approved by the owner at install.
message Manifest {
  repeated Provide provides = 1;
  repeated Use uses = 2;
}

// Runtime to kernel: may this call go ahead, and with what permissions?
message RouteRequest {
  Source source = 1;
  string agent = 2;
  Kind kind = 3;
  string interface = 4;
}

message RouteReply {
  bool allowed = 1;
  string reason = 2;
  // Content hash of the module to run.
  string module = 3;
  // What the called agent may read and send while handling this call.
  repeated Grant reads = 4;
  repeated Grant sends = 5;
}

message Install {
  string agent = 1;
  string module = 2;
  Manifest manifest = 3;
}

// Runtime to kernel, on the owner's behalf.
message AdminRequest {
  oneof op {
    Install install = 1;
    bool list_modules = 2;
  }
}

message AdminReply {
  bool ok = 1;
  string error = 2;
  repeated string modules = 3;
}

// Agent to runtime.
message ReadRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
}

message SendRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
}

// A log is an append-only, numbered list of entries published by one agent under one of its
// interfaces. Other agents, other ships, and the owner's clients follow it by number.

// The signed part of a log entry.
message EntryBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  // Entries are numbered from 1 with no gaps.
  uint64 seq = 4;
  // SHA-256 of the previous entry's body, so a missing or altered entry breaks the chain.
  // Empty for entry 1.
  bytes prev = 5;
  bytes payload = 6;
}

// An entry as stored and sent. `body` is an encoded EntryBody, kept exactly as it was signed;
// it is never re-encoded before the signature is checked.
//
// What is signed is never the bare body. A label naming the kind of message comes first:
// the bytes of "ship.v1.entry\n" for an entry, "ship.v1.checkpoint\n" for a checkpoint. A
// signature made for one kind of message can therefore never be passed off as the other,
// however alike the two messages look.
message SignedEntry {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime: add an entry to one of this agent's own logs.
message AppendRequest {
  string log = 1;
  bytes payload = 2;
}

// Agent to runtime: start following another agent's log.
message FollowRequest {
  string agent = 1;
  string log = 2;
}

// Agent to runtime: give me the entries after my position in a log I follow, and move my
// position past them. The move is kept only if this event commits.
message NextRequest {
  string agent = 1;
  string log = 2;
  uint32 max = 3;
  // Set by a follower that knows what to do with NextReply.checkpoint. One that does not set
  // it is never moved past entries it has not seen: if they have been dropped, its request
  // fails instead.
  bool checkpoints = 4;
}

message Entry {
  uint64 seq = 1;
  bytes payload = 2;
}

message NextReply {
  repeated Entry entries = 1;
  // True when the log has entries beyond these.
  bool more = 2;
  // Set when the follower was so far behind that the entries it needed have been dropped. It
  // must replace what it holds with this state; its position is then the checkpoint's.
  Checkpoint checkpoint = 3;
}

// A checkpoint says: as of entry `seq`, the state behind this log is `state`. It lets entries
// up to an earlier point be dropped without anyone losing the ability to catch up.

// The signed part of a checkpoint.
message CheckpointBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  uint64 seq = 4;
  // SHA-256 of entry `seq`'s body, so a reader can carry on checking entries from here.
  bytes hash = 5;
  bytes state = 6;
}

// A checkpoint as stored and sent, signed over `body` exactly as it stands.
message SignedCheckpoint {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime, in answer to KIND_CHECKPOINT. Leaving `state` unset means this log is a
// history whose every entry matters, and must never be trimmed.
message CheckpointReply {
  optional bytes state = 1;
}

// Runtime to a follower: the state to take, and the entry it stands for.
message Checkpoint {
  uint64 seq = 1;
  bytes state = 2;
}

// The kernel's own stored state. A kernel rewrites the whole registry when it changes, and
// fields it does not know are lost in the rewrite, so a kernel must never be run against a
// registry written by a newer one. A kernel upgrade migrates the registry forward.
message Registered {
  string name = 1;
  string module = 2;
  Manifest manifest = 3;
}

message Registry {
  repeated Registered agents = 1;
}

// Clients: phones and browsers that sign in to a ship and use it over HTTP.

// Client to ship: trade a sign-in code for a token of this device's own. The code is either a
// one-time code, good for a single use and a short while, or the ship's reusable access code.
message SignInRequest {
  string code = 1;
  // What to call this device in the owner's list, such as "Bill's phone".
  string label = 2;
}

message SignInReply {
  // Sent with every later request. The ship keeps only a hash of it, so it is shown this once.
  string token = 1;
  Device device = 2;
}

// One signed-in device.
message Device {
  uint64 id = 1;
  string label = 2;
  uint64 created_ms = 3;
}

message DeviceList {
  repeated Device devices = 1;
  // The device that asked.
  uint64 current = 2;
}

// Where a log ends: the number and hash of its newest entry. `seq` is 0 for a log with none.
message LogHead {
  uint64 seq = 1;
  bytes hash = 2;
}

message EntryList {
  repeated SignedEntry entries = 1;
  // Where the log ended when this was answered, so a reader can tell whether it has caught up.
  LogHead head = 2;
}

// The entries asked for have been dropped. The log now starts after entry `base`; the reader
// takes the log's checkpoint and carries on from there.
message Trimmed {
  uint64 base = 1;
}
