// Messages exchanged between the runtime, the kernel, and agents.
//
// Evolution rule: fields are only ever added. A field number is never reused or given a new
// meaning, and a new field must be safe for an old reader to ignore and for a new reader to
// find absent. Anything else gets a new message or interface name.
syntax = "proto3";

package ship.v1;

enum Kind {
  KIND_UNSPECIFIED = 0;
  // Changes state. Runs as its own event and transaction.
  KIND_COMMAND = 1;
  // Returns data and cannot change anything.
  KIND_READ = 2;
  // Tells an agent that a log it follows has new entries. Carries no payload: the agent asks
  // for the entries. Runs as its own event, like a command.
  KIND_NOTIFY = 3;
  // Asks an agent for the present state behind one of its logs, so that old entries can be
  // dropped. The payload is the log's name. The agent can only read while answering.
  KIND_CHECKPOINT = 4;
  // Tells an agent what became of a command it sent to an agent on another ship. The payload
  // is a Receipt. Runs as its own event, like a command.
  KIND_RECEIPT = 5;
}

// Who is asking.
message Source {
  // The ship's owner, through a client or the runtime's API.
  bool owner = 1;
  // Otherwise, the agent making the request.
  string agent = 2;
  // Set when that agent is on another ship: the ship's name. The other ship proved who it is
  // when it connected, so this can be relied on. Empty for an agent on this ship.
  string ship = 3;
}

// What an agent is told about the call it is handling.
message Invocation {
  Kind kind = 1;
  string interface = 2;
  Source source = 3;
}

// Permission to use one interface of one agent.
message Grant {
  string agent = 1;
  string interface = 2;
  // Empty for an agent on this ship. Otherwise the ship the agent is on, or "*" for the
  // agent of that name on any ship.
  string ship = 3;
}

message Provide {
  string interface = 1;
  // Any agent on the ship may use a public interface without declaring it.
  bool public = 2;
  // Agents on other ships may send commands to it. The owner agrees to this at install. The
  // agent is told which ship is asking, and it is the agent that decides what each may do.
  bool remote = 3;
}

message Use {
  string agent = 1;
  string interface = 2;
  bool read = 3;
  bool send = 4;
  // Empty for an agent on this ship. Otherwise the ship that agent is on, or "*" for any
  // ship. For another ship, `send` lets this agent send that agent commands, and `read` lets
  // it follow that agent's log of this name. The owner agrees to both at install.
  string ship = 5;
}

// What an agent offers and what it needs. Approved by the owner at install.
message Manifest {
  repeated Provide provides = 1;
  repeated Use uses = 2;
}

// Runtime to kernel: may this call go ahead, and with what permissions?
message RouteRequest {
  Source source = 1;
  string agent = 2;
  Kind kind = 3;
  string interface = 4;
}

message RouteReply {
  bool allowed = 1;
  string reason = 2;
  // Content hash of the module to run.
  string module = 3;
  // What the called agent may read and send while handling this call.
  repeated Grant reads = 4;
  repeated Grant sends = 5;
}

message Install {
  string agent = 1;
  string module = 2;
  Manifest manifest = 3;
}

// Runtime to kernel, on the owner's behalf.
message AdminRequest {
  oneof op {
    Install install = 1;
    bool list_modules = 2;
  }
}

message AdminReply {
  bool ok = 1;
  string error = 2;
  repeated string modules = 3;
}

// Agent to runtime.
message ReadRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
}

message SendRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
  // The ship the agent is on. Empty for this ship. A command for another ship is kept until
  // that ship has it, and reaches it exactly once.
  string ship = 4;
}

// A log is an append-only, numbered list of entries published by one agent under one of its
// interfaces. Other agents, other ships, and the owner's clients follow it by number.

// The signed part of a log entry.
message EntryBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  // Entries are numbered from 1 with no gaps.
  uint64 seq = 4;
  // SHA-256 of the previous entry's body, so a missing or altered entry breaks the chain.
  // Empty for entry 1.
  bytes prev = 5;
  bytes payload = 6;
}

// An entry as stored and sent. `body` is an encoded EntryBody, kept exactly as it was signed;
// it is never re-encoded before the signature is checked.
//
// What is signed is never the bare body. A label naming the kind of message comes first:
// the bytes of "ship.v1.entry\n" for an entry, "ship.v1.checkpoint\n" for a checkpoint. A
// signature made for one kind of message can therefore never be passed off as the other,
// however alike the two messages look.
message SignedEntry {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime: add an entry to one of this agent's own logs.
message AppendRequest {
  string log = 1;
  bytes payload = 2;
}

// Agent to runtime: start following another agent's log, or stop.
message FollowRequest {
  string agent = 1;
  string log = 2;
  // The ship that agent is on. Empty for this ship.
  string ship = 3;
}

// Agent to runtime: let another ship follow one of this agent's own logs, or stop letting it.
// It is the agent that decides who may follow its logs, and nobody else.
message ShareRequest {
  string log = 1;
  // The ship, or "*" for every ship.
  string ship = 2;
  // Set to stop sharing. A ship that was following is told the log is closed to it.
  bool stop = 3;
}

// Agent to runtime: give me the entries after my position in a log I follow, and move my
// position past them. The move is kept only if this event commits.
message NextRequest {
  string agent = 1;
  string log = 2;
  uint32 max = 3;
  // Set by a follower that knows what to do with NextReply.checkpoint. One that does not set
  // it is never moved past entries it has not seen: if they have been dropped, its request
  // fails instead.
  bool checkpoints = 4;
  // The ship that agent is on. Empty for this ship.
  string ship = 5;
}

message Entry {
  uint64 seq = 1;
  bytes payload = 2;
}

message NextReply {
  repeated Entry entries = 1;
  // True when the log has entries beyond these.
  bool more = 2;
  // Set when the follower was so far behind that the entries it needed have been dropped. It
  // must replace what it holds with this state; its position is then the checkpoint's.
  Checkpoint checkpoint = 3;
  // For a log on another ship: set when no more of it will come, with a few words on why.
  // That ship has stopped sharing it, or what it sends no longer carries on from what this
  // ship holds. Following the log again asks afresh.
  string stopped = 4;
}

// A checkpoint says: as of entry `seq`, the state behind this log is `state`. It lets entries
// up to an earlier point be dropped without anyone losing the ability to catch up.

// The signed part of a checkpoint.
message CheckpointBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  uint64 seq = 4;
  // SHA-256 of entry `seq`'s body, so a reader can carry on checking entries from here.
  bytes hash = 5;
  bytes state = 6;
}

// A checkpoint as stored and sent, signed over `body` exactly as it stands.
message SignedCheckpoint {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime, in answer to KIND_CHECKPOINT. Leaving `state` unset means this log is a
// history whose every entry matters, and must never be trimmed.
message CheckpointReply {
  optional bytes state = 1;
}

// Runtime to a follower: the state to take, and the entry it stands for.
message Checkpoint {
  uint64 seq = 1;
  bytes state = 2;
}

// The kernel's own stored state. A kernel rewrites the whole registry when it changes, and
// fields it does not know are lost in the rewrite, so a kernel must never be run against a
// registry written by a newer one. A kernel upgrade migrates the registry forward.
message Registered {
  string name = 1;
  string module = 2;
  Manifest manifest = 3;
}

message Registry {
  repeated Registered agents = 1;
}

// Clients: phones and browsers that sign in to a ship and use it over HTTP.

// Client to ship: trade a sign-in code for a token of this device's own. The code is either a
// one-time code, good for a single use and a short while, or the ship's reusable access code.
message SignInRequest {
  string code = 1;
  // What to call this device in the owner's list, such as "Bill's phone".
  string label = 2;
}

message SignInReply {
  // Sent with every later request. The ship keeps only a hash of it, so it is shown this once.
  string token = 1;
  Device device = 2;
}

// One signed-in device.
message Device {
  uint64 id = 1;
  string label = 2;
  uint64 created_ms = 3;
}

message DeviceList {
  repeated Device devices = 1;
  // The device that asked.
  uint64 current = 2;
}

// Where a log ends: the number and hash of its newest entry. `seq` is 0 for a log with none.
message LogHead {
  uint64 seq = 1;
  bytes hash = 2;
}

message EntryList {
  repeated SignedEntry entries = 1;
  // Where the log ended when this was answered, so a reader can tell whether it has caught up.
  LogHead head = 2;
}

// The entries asked for have been dropped. The log now starts after entry `base`; the reader
// takes the log's checkpoint and carries on from there.
message Trimmed {
  uint64 base = 1;
}

// Ship to ship. Two ships talk over an encrypted connection in which each has proved it holds
// the key listed for its name. One request and one reply travel on each stream.

message PeerRequest {
  oneof body {
    Ping ping = 1;
    Deliver deliver = 2;
    Fetch fetch = 3;
    News news = 4;
    Resync resync = 5;
  }
}

message PeerReply {
  oneof body {
    Pong pong = 1;
    Delivered delivered = 2;
    Fetched fetched = 3;
    Heard heard = 4;
    Resynced resynced = 5;
  }
  // Set, with no body, when the request was not one the other ship would answer.
  string refused = 15;
}

// Asks the other ship to say who it is and who it takes the asker to be.
message Ping {
  bytes nonce = 1;
}

message Pong {
  // Echoed from the Ping.
  bytes nonce = 1;
  // The ship that answered, as it names itself.
  string ship = 2;
  // The ship the answerer says it was shown proof of at the other end of the connection.
  // This is the answerer's word. The asker cannot check it.
  string caller = 3;
  // A mark that changes whenever the ship that answers is brought back from a saved copy
  // of itself. A ship that follows its logs keeps the mark it last saw. If the mark has
  // changed, that ship may no longer know who follows what, so its followers ask afresh.
  bytes incarnation = 4;
}

// Commands from one ship to another, and the answers to them. Each ship numbers what it sends
// to each other ship from 1, and keeps each message until the other ship says it has it. The
// other ship takes them strictly in order and remembers the last number it took, so a message
// that arrives twice is recognised and dropped. Together that is exactly once, in order.
//
// Having a command is not running it. When the receiving ship has run a command, or refused
// it, it sends a receipt back the same way, so that arrives exactly once too. Every command
// gets one receipt.

// One message, as it travels: a command, or a receipt for a command that came the other way.
message PeerMessage {
  // Its number among the messages this ship has sent to that ship.
  uint64 seq = 1;
  // For a command: the agent that sent it.
  string from_agent = 2;
  // For a command: the agent it is for, and the interface.
  string agent = 3;
  string interface = 4;
  bytes payload = 5;
  // Set when this is a receipt and not a command. The fields above are then empty.
  Receipt receipt = 6;
}

// What became of a command on the ship it was sent to.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  // It ran, and what it did is saved.
  VERDICT_RAN = 1;
  // It was not allowed: there is no such agent there, or the interface is not open to
  // other ships. `reason` says which.
  VERDICT_DENIED = 2;
  // It was allowed but the agent's handler failed: it crashed, or ran out of fuel or time.
  // Nothing it did was kept. The details stay in that ship's own audit log.
  VERDICT_FAILED = 3;
  // It ran into one of that ship's limits, such as a full log. `reason` says which.
  VERDICT_LIMIT = 4;
  // It was not something that could be run at all.
  VERDICT_MALFORMED = 5;
  // Nobody can say. One of the two ships went back to an earlier state, such as a restored
  // backup, and the record of this command, or of the answer to it, went with that. The
  // command may have run. This is made up by the sender's own ship when the two ships
  // find that their accounts of what has passed between them no longer agree.
  VERDICT_LOST = 6;
}

message Receipt {
  // The number of the command this is about: the one `send_to` returned to the sender.
  uint64 about = 1;
  Verdict verdict = 2;
  // A few words on why, for a command that did not run. For reading, not for parsing.
  string reason = 3;
  // Where the command was sent. Filled in by the sender's own runtime from its record of
  // the command when it hands the receipt to the agent. Empty on the wire.
  string ship = 4;
  string agent = 5;
  string interface = 6;
}

// Some messages, in order of their numbers.
message Deliver {
  repeated PeerMessage messages = 1;
}

// The number of the last message from the sender that the receiver now holds. It may be
// lower than the last one sent, when the receiver had no room for the rest; the sender sends
// those again later.
message Delivered {
  uint64 last = 1;
}

// Following a log on another ship. The ship that follows asks for the entries after the last
// one it holds, checks each against the publishing ship's key and against the entry before
// it, and keeps them for its agent. The publishing ship keeps a note of each ship that
// follows a log, and tells it when the log has grown. Being told is only a prompt to ask:
// the entries always come by asking, so the ship that follows takes them when it has room.

// A ship that follows to the ship that publishes: the entries of a log after number `after`.
message Fetch {
  string agent = 1;
  string log = 2;
  uint64 after = 3;
  // About how many bytes of entries to send. One entry is always sent if there is one.
  uint32 max_bytes = 4;
  // Set when the asker is starting to follow, or starting again. The publisher then takes
  // nothing it noted about this follower before for granted.
  bool joining = 5;
}

message Fetched {
  // In order, starting at `after` + 1. Empty when there are none, or a checkpoint is sent.
  repeated SignedEntry entries = 1;
  // Where the log ends now.
  LogHead head = 2;
  // Set, with no entries, when the entry after `after` has been dropped. The asker takes
  // this state and asks again from the entry it stands for.
  SignedCheckpoint checkpoint = 3;
  // Set, with nothing else, when the asker may not follow this log. The same is said
  // whether or not there is such a log.
  string denied = 4;
  // The answering ship's mark, as in Pong. Empty when the asker is refused.
  bytes incarnation = 5;
}

// The ship that publishes to a ship that follows: these logs have grown, or are closed to it.
message News {
  repeated LogNews logs = 1;
}

message LogNews {
  string agent = 1;
  string log = 2;
  // The number of the log's newest entry.
  uint64 head = 3;
  // The publisher no longer shares this log with the ship being told.
  bool closed = 4;
}

// For each log in the News, in order: whether the ship that was told does not follow it. The
// publisher then stops telling it.
message Heard {
  repeated bool unknown = 1;
}

// Putting two ships back in step. Each ship numbers what it sends the other and remembers
// how far it has got in what the other sends. If one of them goes back to an earlier state,
// such as a restored backup, those accounts no longer agree: it may reuse numbers the other
// has seen, or wait for messages the other let go of long ago. Nothing can bring back what
// was lost with the earlier state. What can be done is to agree where things stand now, and
// to tell the agents whose commands were caught up in it. Each ship says where it stands,
// and each brings its own account into line with what the other says.

// Where one ship stands with another.
message Standing {
  // The number of the last message this ship has sent the other.
  uint64 sent = 1;
  // The number of the last message of the other's that this ship holds.
  uint64 received = 2;
  // The number of the oldest message this ship still has waiting to go to the other: one
  // more than the last the other said it held. One more than `sent` if nothing is waiting.
  uint64 oldest = 3;
  // The other ship's commands that this ship holds and has yet to answer, or has answered
  // in a receipt still waiting to go: their numbers, eight bytes each, lowest first.
  bytes owed = 4;
  // Whether `owed` is all of them. If not, nothing is said about any above the last listed.
  bool owed_complete = 5;
}

message Resync {
  Standing standing = 1;
}

message Resynced {
  // Where the answering ship stands, once it has taken the asker's account into its own.
  Standing standing = 1;
}
