// Messages exchanged between the runtime, the kernel, and agents.
//
// Evolution rule: fields are only ever added. A field number is never reused or given a new
// meaning, and a new field must be safe for an old reader to ignore and for a new reader to
// find absent. Anything else gets a new message or interface name.
syntax = "proto3";

package ship.v1;

enum Kind {
  KIND_UNSPECIFIED = 0;
  // Changes state. Runs as its own event and transaction.
  KIND_COMMAND = 1;
  // Returns data and cannot change anything.
  KIND_READ = 2;
  // Tells an agent that a log it follows has new entries. Carries no payload: the agent asks
  // for the entries. Runs as its own event, like a command.
  KIND_NOTIFY = 3;
  // Asks an agent for the present state behind one of its logs, so that old entries can be
  // dropped. The payload is the log's name. The agent can only read while answering.
  KIND_CHECKPOINT = 4;
  // Tells an agent what became of a command it sent to an agent on another ship. The payload
  // is a Receipt. Runs as its own event, like a command.
  KIND_RECEIPT = 5;
  // Asks an agent whether another ship may have a file the agent claims. The payload is a
  // FileAsk; the reply a FileAnswer. The agent can only read while answering, and nothing it
  // does is kept.
  KIND_FILE_ASK = 6;
  // Tells an agent what came of a question it put to an agent on another ship with `ask_to`.
  // The payload is an Answered. Runs as its own event, like a command. Exactly one for each
  // question, unless the agent dropped it first.
  KIND_ANSWER = 7;
}

// Who is asking.
message Source {
  // The ship's owner, through a client or the runtime's API.
  bool owner = 1;
  // Otherwise, the agent making the request.
  string agent = 2;
  // Set when that agent is on another ship: the ship's name. The other ship proved who it is
  // when it connected, so this can be relied on. Empty for an agent on this ship.
  string ship = 3;
}

// What an agent is told about the call it is handling.
message Invocation {
  Kind kind = 1;
  string interface = 2;
  Source source = 3;
}

// Permission to use one interface of one agent.
message Grant {
  string agent = 1;
  string interface = 2;
  // Empty for an agent on this ship. Otherwise the ship the agent is on, or "*" for the
  // agent of that name on any ship.
  string ship = 3;
}

message Provide {
  string interface = 1;
  // Any agent on the ship may use a public interface without declaring it.
  bool public = 2;
  // Agents on other ships may send commands to it. The owner agrees to this at install. The
  // agent is told which ship is asking, and it is the agent that decides what each may do.
  bool remote = 3;
  // Agents on other ships, and other ships' owners, may ask it questions: its read handler
  // answers, read-only, and nothing it does is kept. Apart from `remote`: an owner can open an
  // interface to one and not the other. The agent is told which ship (and agent) is asking.
  bool asked = 4;
}

message Use {
  string agent = 1;
  string interface = 2;
  bool read = 3;
  bool send = 4;
  // Empty for an agent on this ship. Otherwise the ship that agent is on, or "*" for any
  // ship. For another ship, `send` lets this agent send that agent commands, and `read` lets
  // it follow that agent's log of this name. The owner agrees to both at install.
  string ship = 5;
  // Only with `ship` set: this agent may ask that agent's interface on that ship (or on any
  // ship, with "*") questions, with `ask_to`. Apart from `read` and `send`.
  bool ask = 6;
}

// What an agent offers and what it needs. Approved by the owner at install.
message Manifest {
  repeated Provide provides = 1;
  repeated Use uses = 2;
}

// Runtime to kernel: may this call go ahead, and with what permissions?
message RouteRequest {
  Source source = 1;
  string agent = 2;
  Kind kind = 3;
  string interface = 4;
}

message RouteReply {
  bool allowed = 1;
  string reason = 2;
  // Content hash of the module to run.
  string module = 3;
  // What the called agent may read and send while handling this call.
  repeated Grant reads = 4;
  repeated Grant sends = 5;
  // The interfaces on other ships the called agent may ask questions of.
  repeated Grant asks = 6;
}

message Install {
  string agent = 1;
  string module = 2;
  Manifest manifest = 3;
}

// Runtime to kernel, on the owner's behalf.
message AdminRequest {
  oneof op {
    Install install = 1;
    bool list_modules = 2;
  }
}

message AdminReply {
  bool ok = 1;
  string error = 2;
  repeated string modules = 3;
}

// Agent to runtime.
message ReadRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
}

message SendRequest {
  string agent = 1;
  string interface = 2;
  bytes payload = 3;
  // The ship the agent is on. Empty for this ship. A command for another ship is kept until
  // that ship has it, and reaches it exactly once.
  string ship = 4;
  // For another ship: the sender wants the handler's reply back with the receipt. If the
  // command runs, its receipt carries the reply (`Receipt.replied` set); a reply larger than
  // either ship allows means the command does not stand, and the receipt says LIMIT.
  // The whole reply comes back with RAN from a receiving ship that follows the protocol. A
  // receipt can say RAN with `Receipt.replied` unset when the other ship's runtime predates
  // replies, or when it broke the protocol (a reply over the bound the command was sent with,
  // or a reply not marked): the command is still reported as run, because the other ship said
  // so; no reply is handed on. A reply that breaks the protocol is discarded. If a fault also
  // arrived, the reason describes what happened to the fault. Otherwise it identifies the
  // discarded reply. An agent that needs the reply checks `Receipt.replied`. This holds while
  // neither ship makes its message, inbox or reply limits smaller while the command or its
  // receipt is outstanding.
  // A ship that takes back no reply at all (its largest is 0) refuses to send such a
  // command, since 0 in `PeerMessage.reply_most` means no reply is wanted.
  bool reply = 5;
}

// Agent to runtime: put a question to an agent on another ship. The answer, or why there is
// none, comes later as a KIND_ANSWER event.
message AskRequest {
  // Another ship: not empty, and not the asking agent's own.
  string ship = 1;
  string agent = 2;
  string interface = 3;
  bytes payload = 4;
  // How long the question is given. Its time is stamped just before the asking event commits (whole
  // milliseconds of this runtime's wall clock, so a slow commit uses some of it), and turned into a
  // steady-clock deadline once, when the question's task starts, before it reads the row: a later
  // change of the clock does not move it, though a restart reads the stamped time afresh. Each try
  // tells the other ship what is left of it, in whole milliseconds, looked at again with the
  // deadline on every poll of the write before any of the question's bytes are taken: at the poll
  // in which the connection accepts a question's first bytes, the allowance in those bytes is no
  // more than the whole milliseconds left to the asker's deadline by the clock reading taken in
  // that poll, and no first bytes are accepted in a poll whose clock reading leaves less than a
  // millisecond. The first-write rule uses the clock reading taken in the accepting poll, and time
  // spent encoding, waiting inside the writer, or descheduled after that reading can carry actual
  // acceptance past the deadline. (When the other ship has them is not promised.) Only the
  // network's giving up keeps this time; writing the answer down and running the `answer` handler
  // come after it (see the README's Known limits).
  uint64 within_millis = 5;
}

// What came of a question an agent put to another ship.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  // The other agent answered, within the time: `reply` holds what it said.
  OUTCOME_REPLY = 1;
  // The other ship would not let the question be asked. `reason` is its kernel's words, or
  // the runtime's own when a name in the question is not a name (refused before the kernel
  // is asked).
  OUTCOME_DENIED = 2;
  // The other agent failed (it trapped, or ran out of fuel or time), or the other ship could
  // not route the question to it or read its own file for it. Fixed words only.
  OUTCOME_FAILED = 3;
  // The question or its answer was larger than one of the two ships allows (in a message, or
  // as a question or an answer), or this ship had no room in its queue or file for the
  // answer's reply (the reply is then let go and only this is handed over).
  OUTCOME_LIMIT = 4;
  // No answer came within the time the question was given: some try reached the other ship
  // and no answer was taken in time (whatever it said after the time, an answer or a refusal,
  // is not taken), the other ship was too busy each time, or no try could be begun for want of
  // a place among this runtime's requests out.
  OUTCOME_NO_ANSWER = 5;
  // Tries were begun but none ever reached the other ship within that time, or it is not known. A
  // try that finds the destination absent from the directory ends the question as `Unreachable`,
  // even if an earlier try reached it, while a try already awaiting its reply can still complete.
  OUTCOME_UNREACHABLE = 6;
  // The other ship does not know this kind of question (it runs an older runtime), or what
  // came back is not an answer.
  OUTCOME_NOT_UNDERSTOOD = 7;
}

// Runtime to agent, as a KIND_ANSWER event: what came of the question numbered `about`.
message Answered {
  // The number `ask_to` returned.
  uint64 about = 1;
  // Where the question was put.
  string ship = 2;
  string agent = 3;
  string interface = 4;
  Outcome outcome = 5;
  // Set only with OUTCOME_REPLY.
  bytes reply = 6;
  // A few words: the other ship's reason with OUTCOME_DENIED, this runtime's own otherwise.
  string reason = 7;
}

// A log is an append-only, numbered list of entries published by one agent under one of its
// interfaces. Other agents, other ships, and the owner's clients follow it by number.

// The signed part of a log entry.
message EntryBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  // Entries are numbered from 1 with no gaps.
  uint64 seq = 4;
  // SHA-256 of the previous entry's body, so a missing or altered entry breaks the chain.
  // Empty for entry 1.
  bytes prev = 5;
  bytes payload = 6;
}

// An entry as stored and sent. `body` is an encoded EntryBody, kept exactly as it was signed;
// it is never re-encoded before the signature is checked.
//
// What is signed is never the bare body. A label naming the kind of message comes first:
// the bytes of "ship.v1.entry\n" for an entry, "ship.v1.checkpoint\n" for a checkpoint. A
// signature made for one kind of message can therefore never be passed off as the other,
// however alike the two messages look.
message SignedEntry {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime: add an entry to one of this agent's own logs.
message AppendRequest {
  string log = 1;
  bytes payload = 2;
}

// Agent to runtime: start following another agent's log, or stop.
message FollowRequest {
  string agent = 1;
  string log = 2;
  // The ship that agent is on. Empty for this ship.
  string ship = 3;
}

// Agent to runtime: let another ship follow one of this agent's own logs, or stop letting it.
// It is the agent that decides who may follow its logs, and nobody else.
message ShareRequest {
  string log = 1;
  // The ship, or "*" for every ship.
  string ship = 2;
  // Set to stop sharing. A ship that was following is told the log is closed to it.
  bool stop = 3;
}

// Agent to runtime: give me the entries after my position in a log I follow, and move my
// position past them. The move is kept only if this event commits.
message NextRequest {
  string agent = 1;
  string log = 2;
  uint32 max = 3;
  // Set by a follower that knows what to do with NextReply.checkpoint. One that does not set
  // it is never moved past entries it has not seen: if they have been dropped, its request
  // fails instead.
  bool checkpoints = 4;
  // The ship that agent is on. Empty for this ship.
  string ship = 5;
}

message Entry {
  uint64 seq = 1;
  bytes payload = 2;
}

message NextReply {
  repeated Entry entries = 1;
  // True when the log has entries beyond these.
  bool more = 2;
  // Set when the follower was so far behind that the entries it needed have been dropped. It
  // must replace what it holds with this state; its position is then the checkpoint's.
  Checkpoint checkpoint = 3;
  // For a log on another ship: set when no more of it will come, with a few words on why.
  // That ship has stopped sharing it, or what it sends no longer carries on from what this
  // ship holds. Following the log again asks afresh.
  string stopped = 4;
}

// A checkpoint says: as of entry `seq`, the state behind this log is `state`. It lets entries
// up to an earlier point be dropped without anyone losing the ability to catch up.

// The signed part of a checkpoint.
message CheckpointBody {
  string ship = 1;
  string agent = 2;
  string log = 3;
  uint64 seq = 4;
  // SHA-256 of entry `seq`'s body, so a reader can carry on checking entries from here.
  bytes hash = 5;
  bytes state = 6;
}

// A checkpoint as stored and sent, signed over `body` exactly as it stands.
message SignedCheckpoint {
  bytes body = 1;
  bytes signature = 2;
}

// Agent to runtime, in answer to KIND_CHECKPOINT. Leaving `state` unset means this log is a
// history whose every entry matters, and must never be trimmed.
message CheckpointReply {
  optional bytes state = 1;
}

// Runtime to a follower: the state to take, and the entry it stands for.
message Checkpoint {
  uint64 seq = 1;
  bytes state = 2;
}

// The kernel's own stored state. A kernel rewrites the whole registry when it changes, and
// fields it does not know are lost in the rewrite, so a kernel must never be run against a
// registry written by a newer one. A kernel upgrade migrates the registry forward.
message Registered {
  string name = 1;
  string module = 2;
  Manifest manifest = 3;
}

message Registry {
  repeated Registered agents = 1;
}

// Clients: phones and browsers that sign in to a ship and use it over HTTP.

// Client to ship: trade a sign-in code for a token of this device's own. The code is either a
// one-time code, good for a single use and a short while, or the ship's reusable access code.
message SignInRequest {
  string code = 1;
  // What to call this device in the owner's list, such as "Bill's phone".
  string label = 2;
}

message SignInReply {
  // Sent with every later request. The ship keeps only a hash of it, so it is shown this once.
  string token = 1;
  Device device = 2;
}

// One signed-in device.
message Device {
  uint64 id = 1;
  string label = 2;
  uint64 created_ms = 3;
}

message DeviceList {
  repeated Device devices = 1;
  // The device that asked.
  uint64 current = 2;
}

// Where a log ends: the number and hash of its newest entry. `seq` is 0 for a log with none.
message LogHead {
  uint64 seq = 1;
  bytes hash = 2;
}

message EntryList {
  repeated SignedEntry entries = 1;
  // Where the log ended when this was answered, so a reader can tell whether it has caught up.
  LogHead head = 2;
}

// The entries asked for have been dropped. The log now starts after entry `base`; the reader
// takes the log's checkpoint and carries on from there.
message Trimmed {
  uint64 base = 1;
}

// Files on the ship. A file is split into chunks of 1 MiB (the last holds the rest) and known
// by its id: a hash over its length and its chunks' hashes (format 1, see the README).

// A reference to a file: the ship that holds it, its id, its length, and the agent there that
// claims it. Plain data that an agent keeps in place of the file; an agent never holds a
// file's bytes. The id fixes the bytes and the length; the ship and the agent only say where
// to ask, and the agent is the one asked whether the file may be had.
message FileRef {
  string ship = 1;
  bytes id = 2;
  uint64 length = 3;
  string agent = 4;
}

// One file, as the ship tells the agent that claims it, or that agent's owner's devices.
message FileInfo {
  bytes id = 1;
  uint64 length = 2;
  uint64 chunks = 3;
  string media_type = 4;
  uint64 added_ms = 5;
  // Set when the agent has marked the file open: any ship that names it may have it, and
  // the agent is not asked. Never set for a file on another ship.
  bool open = 6;
}

// Agent to runtime: mark a file this agent claims open to every ship, or take the mark off.
message FileMark {
  bytes id = 1;
  bool open = 2;
}

// Runtime to agent, as a KIND_FILE_ASK call: may this ship have this file, which the agent
// claims? The ship proved who it is on its connection.
message FileAsk {
  string ship = 1;
  bytes id = 2;
}

// Agent to runtime: the answer to a FileAsk. Anything but a reply that decodes to `allow`
// set, within 64 bytes, is no.
message FileAnswer {
  bool allow = 1;
}

// A page of an agent's files, in order of id. Ask for the next page after the last id.
message FileList {
  repeated FileInfo files = 1;
}

// Client to ship: start an upload of a file of this length.
message UploadRequest {
  uint64 length = 1;
  // Such as "image/png". Left empty, "application/octet-stream".
  string media_type = 2;
}

message UploadReply {
  // The upload's name, for sending its chunks.
  string upload = 1;
  uint64 chunks = 2;
}

// A run of chunks held: `count` chunks from `first`.
message ChunkRun {
  uint64 first = 1;
  uint64 count = 2;
}

// What an upload holds so far, so a client sends only what is missing.
message UploadState {
  uint64 length = 1;
  uint64 chunks = 2;
  string media_type = 3;
  repeated ChunkRun held = 4;
  // Set when there is more to list: ask again with `from` set to `next`.
  bool more = 5;
  uint64 next = 6;
}

// Client to ship: finish an upload. `id`, if given, is the id the client worked out, and the
// ship refuses to finish if it is not the id of what it holds.
message FinishRequest {
  bytes id = 1;
}

// A file fetched from another ship that this ship keeps, some or all of it, as the owner's
// devices see it (`GET /files/kept`).
message KeptInfo {
  bytes id = 1;
  uint64 length = 2;
  // The bytes of its pieces held.
  uint64 held = 3;
  // When it was last opened.
  uint64 used_ms = 4;
  // Some agent is saving it: it is not thrown away, nor cleared.
  bool saving = 5;
}

// A page of kept files, in order of id. Ask for the next page after the last id.
message KeptList {
  repeated KeptInfo kept = 1;
}

// What a clearing of kept files did (`DELETE /files/kept`, `DELETE /files/kept/<id>`).
message Cleared {
  // Thrown away: no row names them, and their bytes are in the trash or gone.
  uint64 thrown_away = 1;
  // Left alone, because some agent is saving them.
  uint64 being_saved = 2;
}

// Client to ship: save, for the agent in the address, the file `id` that `agent` on `ship`
// claims (`POST /agents/<a>/files/save`). The same call carries a save on.
message SaveRequest {
  string ship = 1;
  string agent = 2;
  bytes id = 3;
}

// Where a save stands. Call again until `done`.
message SaveReply {
  bool done = 1;
  // How many of its chunks the ship holds.
  uint64 held = 2;
  uint64 chunks = 3;
}

// A save in progress (`GET /agents/<a>/files/saves`).
message SaveInfo {
  bytes id = 1;
  uint64 length = 2;
  // The bytes of its pieces held.
  uint64 held = 3;
  uint64 chunks = 4;
  uint64 touched_ms = 5;
}

message SaveList {
  repeated SaveInfo saves = 1;
}

// Ship to ship. Two ships talk over an encrypted connection in which each has proved it holds
// the key listed for its name. One request and one reply travel on each stream.

message PeerRequest {
  oneof body {
    Ping ping = 1;
    Deliver deliver = 2;
    Fetch fetch = 3;
    News news = 4;
    Resync resync = 5;
    Hello hello = 6;
    // A part of a file a ship here holds, for the ship at the other end. See FileWanted.
    FileWanted file_about = 7;
    FileWanted file_leaves = 8;
    FileWanted file_upper = 9;
    FileWanted file_chunk = 10;
    // A question for an agent here that only reads. See Ask.
    Ask ask = 11;
  }
}

message PeerReply {
  oneof body {
    Pong pong = 1;
    Delivered delivered = 2;
    Fetched fetched = 3;
    Heard heard = 4;
    Resynced resynced = 5;
    Welcome welcome = 6;
    FileFacts file_about = 7;
    FileHashes file_leaves = 8;
    FileHashes file_upper = 9;
    FileBytes file_chunk = 10;
    Answer ask = 11;
  }
  // Set, with no body, when the request was not one the other ship would answer.
  string refused = 15;
}

// The first thing said on a connection, by the ship that made it: which ship it is. The
// connection has already shown that the caller holds some key. The ship called looks the
// name up and goes on only if that key is the one listed for it.
message Hello {
  string ship = 1;
  // For a moon, which no list has: its parent's word for its key.
  MoonProof proof = 2;
}

// The answer to a Hello that was believed.
message Welcome {
  // If the ship called is a moon, its parent's word for its key. A caller that did not
  // already know the moon's key checks the key the connection showed against this.
  MoonProof proof = 1;
}

// A moon's parent says: this moon, at this revision of its keys, has this key. The moon and
// the key are known from the connection, so only the revision and the signature travel.
message MoonProof {
  uint32 revision = 1;
  bytes signed = 2;
}

// Asks the other ship to say who it is and who it takes the asker to be.
message Ping {
  bytes nonce = 1;
}

message Pong {
  // Echoed from the Ping.
  bytes nonce = 1;
  // The ship that answered, as it names itself.
  string ship = 2;
  // The ship the answerer says it was shown proof of at the other end of the connection.
  // This is the answerer's word. The asker cannot check it.
  string caller = 3;
  // A mark that changes whenever the ship that answers is brought back from a saved copy
  // of itself. A ship that follows its logs keeps the mark it last saw. If the mark has
  // changed, that ship may no longer know who follows what, so its followers ask afresh.
  bytes incarnation = 4;
}

// Commands from one ship to another, and the answers to them. Each ship numbers what it sends
// to each other ship from 1, and keeps each message until the other ship says it has it. The
// other ship takes them strictly in order and remembers the last number it took, so a message
// that arrives twice is recognised and dropped. Together that is exactly once, in order.
//
// Having a command is not running it. When the receiving ship has run a command, or refused
// it, it sends a receipt back the same way, so that arrives exactly once too. Every command
// gets one receipt.

// One message, as it travels: a command, or a receipt for a command that came the other way.
message PeerMessage {
  // Its number among the messages this ship has sent to that ship.
  uint64 seq = 1;
  // For a command: the agent that sent it.
  string from_agent = 2;
  // For a command: the agent it is for, and the interface.
  string agent = 3;
  string interface = 4;
  bytes payload = 5;
  // Set when this is a receipt and not a command. The fields above are then empty.
  Receipt receipt = 6;
  // For a command: the largest handler's reply, in bytes, the sender takes back with the
  // receipt. 0 (or absent) means no reply is wanted. The ship that runs the command holds the
  // reply to the smaller of this and its own limit; a larger one undoes the command, and the
  // receipt says LIMIT.
  uint64 reply_most = 7;
}

// What became of a command on the ship it was sent to.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  // It ran, and what it did is saved.
  VERDICT_RAN = 1;
  // It was not allowed: there is no such agent there, or the interface is not open to
  // other ships. `reason` says which.
  VERDICT_DENIED = 2;
  // It was allowed but the agent's handler failed: it crashed, or ran out of fuel or time.
  // Nothing it did was kept. The details stay in that ship's own audit log. (An agent that
  // turns a command down on purpose says so with VERDICT_REFUSED instead.)
  VERDICT_FAILED = 3;
  // It ran into one of that ship's limits, such as a full log. `reason` says which.
  VERDICT_LIMIT = 4;
  // It was not something that could be run at all.
  VERDICT_MALFORMED = 5;
  // Nobody can say. One of the two ships went back to an earlier state, such as a restored
  // backup, and the record of this command, or of the answer to it, went with that. The
  // command may have run. This is made up by the sender's own ship when the two ships
  // find that their accounts of what has passed between them no longer agree.
  VERDICT_LOST = 6;
  // It was allowed, and the agent turned it down on purpose. Nothing it did was kept. `fault`
  // says why.
  VERDICT_REFUSED = 7;
}

message Receipt {
  // The number of the command this is about: the one `send_to` returned to the sender.
  uint64 about = 1;
  Verdict verdict = 2;
  // Human-readable words about the verdict or a discarded fault or reply. If a fault and a reply
  // both arrive, the reason describes what happened to the fault. For reading, not for parsing.
  string reason = 3;
  // Where the command was sent. Filled in by the sender's own runtime from its record of
  // the command when it hands the receipt to the agent. Empty on the wire.
  string ship = 4;
  string agent = 5;
  string interface = 6;
  // The handler's reply. Set only with VERDICT_RAN, and only for a command sent with
  // `reply` set (`SendRequest.reply`).
  bytes reply = 7;
  // Set, with VERDICT_RAN, when the receipt carries the handler's reply (which may be empty),
  // so that an empty reply and no reply are told apart.
  // The whole reply comes back with RAN from a receiving ship that follows the protocol. A
  // receipt can say RAN with `Receipt.replied` unset when the other ship's runtime predates
  // replies, or when it broke the protocol (a reply over the bound the command was sent with,
  // or a reply not marked): the command is still reported as run, because the other ship said
  // so; no reply is handed on. A reply that breaks the protocol is discarded. If a fault also
  // arrived, the reason describes what happened to the fault. Otherwise it identifies the
  // discarded reply. An agent that needs the reply checks `Receipt.replied`. This holds while
  // neither ship makes its message, inbox or reply limits smaller while the command or its
  // receipt is outstanding.
  bool replied = 8;
  // Why the agent turned the command down. Set only with VERDICT_REFUSED. With
  // VERDICT_REFUSED, the sender takes a fault whose code is 1 to 64 bytes in 0x21 through 0x7e
  // and whose message is at most 200 bytes, replacing each message control character with a
  // space. It discards the fault for any other verdict, an invalid code or an overlong message.
  Fault fault = 9;
}

// Some messages, in order of their numbers.
message Deliver {
  repeated PeerMessage messages = 1;
}

// The number of the last message from the sender that the receiver now holds. It may be
// lower than the last one sent, when the receiver had no room for the rest; the sender sends
// those again later.
message Delivered {
  uint64 last = 1;
}

// Following a log on another ship. The ship that follows asks for the entries after the last
// one it holds, checks each against the publishing ship's key and against the entry before
// it, and keeps them for its agent. The publishing ship keeps a note of each ship that
// follows a log, and tells it when the log has grown. Being told is only a prompt to ask:
// the entries always come by asking, so the ship that follows takes them when it has room.

// Fetching a file from another ship. The asking ship names the agent that claims the file
// and the file's id, and asks for one part at a time: what the file is (its length and media
// type), one group of its chunks' hashes (chunks `index * 32768` on, as many as there are, at
// most 32,768), the index hash of every group (only for a file of more than 32,768 chunks),
// or one chunk (`index`), whole. Before each, the ship asked checks afresh that the caller may
// have the file. Every refusal is the same `denied`, whatever the reason. The id is checked
// against what comes: nothing but the media type is taken on the other ship's word. A request
// over 1,024 bytes, encoded, is refused before anything is looked up.
message FileWanted {
  string agent = 1;
  bytes id = 2;
  // The group of hashes, or the chunk. Unused for the other parts.
  uint64 index = 3;
}

// What a file is. Set `denied` alone, when the caller may not have it.
message FileFacts {
  string denied = 1;
  uint64 length = 2;
  string media_type = 3;
}

// Hashes of 32 bytes each, one after another. Set `denied` alone, when the caller may not
// have the file.
message FileHashes {
  string denied = 1;
  bytes hashes = 2;
}

// One chunk of a file, whole. Set `denied` alone, when the caller may not have the file.
message FileBytes {
  string denied = 1;
  bytes data = 2;
}

// A question from one ship to an agent on another, answered by that agent's read handler,
// read-only: nothing it does is kept, and nothing is kept of the question on the ship that
// answers: it stores no application data there. (Opening that ship for it, or putting another
// ship to sleep to make room for it, can recover a transaction that a crash interrupted, copy
// pages that ordinary work had already committed from the log beside the file into the file,
// and create or remove the files SQLite keeps beside the ship's file; see the README.) Asking
// twice is harmless.
message Ask {
  // The agent on the asking ship that asks. Empty when that ship's owner asks, through one of
  // their devices.
  string from_agent = 1;
  string agent = 2;
  string interface = 3;
  bytes payload = 4;
  // How long the asker will wait: what is left of its own deadline, in whole milliseconds. At the
  // poll in which the connection accepts a question's first bytes, the allowance in those bytes is
  // no more than the whole milliseconds left to the asker's deadline by the clock reading taken in
  // that poll, and no first bytes are accepted in a poll whose clock reading leaves less than a
  // millisecond. The first-write rule uses the clock reading taken in the accepting poll, and time
  // spent encoding, waiting inside the writer, or descheduled after that reading can carry actual
  // acceptance past the deadline. The ship that answers counts it from one reading of its clock
  // when the question's stream is taken up, cut to its own limit, as the handler's deadline. 0 from
  // a peer is no time at all: the ship asked takes a place and an allowance as for any question,
  // then answers `failed` ("it took too long") without running anything; it is not "the default" or
  // "no limit". A call is never stopped for time before its deadline. After its deadline it is
  // stopped at the first point where the running code looks (a loop turn, a function entry, a bulk
  // memory step) and finds both that the watchdog has ticked since the call was last allowed on and
  // that the deadline has passed. The watchdog ticks about every 10 ms; the system can run it, and
  // the call's own thread, late; and after a look that came just before the deadline the call can
  // run on until a later tick; so no number is promised for the overrun. A host call under way is
  // not cut short. Whatever a call returns after its deadline is not kept.
  uint64 within_millis = 5;
}

// The answer to an Ask: exactly one of these. A ship too busy answers the bare `refused` that
// every request may get instead.
message Answer {
  oneof outcome {
    // What the agent's read handler said.
    bytes reply = 1;
    // Not allowed. The kernel's reason, or the runtime's own for a name that is not one.
    string denied = 2;
    // The handler trapped, or ran out of fuel or time, or the question could not be routed
    // to it or the ship's file read for it. Fixed words; details are not kept.
    string failed = 3;
    // The question or the reply was larger than this ship allows. Fixed words.
    string limit = 4;
  }
}

// A ship that follows to the ship that publishes: the entries of a log after number `after`.
message Fetch {
  string agent = 1;
  string log = 2;
  uint64 after = 3;
  // About how many bytes of entries to send. One entry is always sent if there is one.
  uint32 max_bytes = 4;
  // Set when the asker is starting to follow, or starting again. The publisher then takes
  // nothing it noted about this follower before for granted.
  bool joining = 5;
}

message Fetched {
  // In order, starting at `after` + 1. Empty when there are none, or a checkpoint is sent.
  repeated SignedEntry entries = 1;
  // Where the log ends now.
  LogHead head = 2;
  // Set, with no entries, when the entry after `after` has been dropped. The asker takes
  // this state and asks again from the entry it stands for.
  SignedCheckpoint checkpoint = 3;
  // Set, with nothing else, when the asker may not follow this log. The same is said
  // whether or not there is such a log.
  string denied = 4;
  // The answering ship's mark, as in Pong. Empty when the asker is refused.
  bytes incarnation = 5;
}

// The ship that publishes to a ship that follows: these logs have grown, or are closed to it.
message News {
  repeated LogNews logs = 1;
}

message LogNews {
  string agent = 1;
  string log = 2;
  // The number of the log's newest entry.
  uint64 head = 3;
  // The publisher no longer shares this log with the ship being told.
  bool closed = 4;
}

// For each log in the News, in order: whether the ship that was told does not follow it. The
// publisher then stops telling it.
message Heard {
  repeated bool unknown = 1;
}

// Putting two ships back in step. Each ship numbers what it sends the other and remembers
// how far it has got in what the other sends. If one of them goes back to an earlier state,
// such as a restored backup, those accounts no longer agree: it may reuse numbers the other
// has seen, or wait for messages the other let go of long ago. Nothing can bring back what
// was lost with the earlier state. What can be done is to agree where things stand now, and
// to tell the agents whose commands were caught up in it. Each ship says where it stands,
// and each brings its own account into line with what the other says.

// Where one ship stands with another.
message Standing {
  // The number of the last message this ship has sent the other.
  uint64 sent = 1;
  // The number of the last message of the other's that this ship holds.
  uint64 received = 2;
  // The number of the oldest message this ship still has waiting to go to the other: one
  // more than the last the other said it held. One more than `sent` if nothing is waiting.
  uint64 oldest = 3;
  // The other ship's commands that this ship holds and has yet to answer, or has answered
  // in a receipt still waiting to go: their numbers, eight bytes each, lowest first.
  bytes owed = 4;
  // Whether `owed` is all of them. If not, nothing is said about any above the last listed.
  bool owed_complete = 5;
}

message Resync {
  Standing standing = 1;
}

message Resynced {
  // Where the answering ship stands, once it has taken the asker's account into its own.
  Standing standing = 1;
}

// Where a ship is. Urbit ID says which key belongs to which ship, not where the ship can be
// reached, so a ship says that itself: it signs a small record of its addresses and gives it
// to a lookup point, and anyone who wants to call it asks the point for the record and checks
// the signature. What is signed is not this encoding but a fixed layout of the same fields
// (see `runtime/src/whereabouts.rs`), so a record is checked against exactly the bytes its
// ship signed whatever protobuf library wrote it. A record is taken only if decoding it and
// encoding it again gives the same bytes: nothing unknown, repeated, or padded rides along.
message Whereabouts {
  // The ship, by number. A moon's number is its parent's with more in front.
  uint64 ship = 1;
  // One to four addresses, each an IPv4 address and port (six bytes) or an IPv6 address and
  // port (eighteen), port last, all in network order.
  repeated bytes addresses = 2;
  // When the ship made the record, in milliseconds since 1970.
  uint64 issued = 3;
  // For a moon, which Urbit ID does not list: the key that signed, and its parent's word for
  // that key. Neither is signed: the signature is checked with the key, and the word with the
  // parent's key from Urbit ID.
  bytes moon_key = 4;
  MoonProof proof = 5;
  // The ship's signature, with its networking key, over the fixed layout.
  bytes signature = 6;
  // The ship's own word that callers should ask its lookup point to introduce them before
  // they call: it is behind a router that lets nothing in that it has not sent to first.
  // Under the signature, so a point can neither set it nor clear it.
  bool introduce = 7;
}

// To a lookup point, over a connection of its own protocol (`ship-where/1`). One request and
// one reply travel on each stream.
message WhereRequest {
  oneof body {
    Announce announce = 1;
    Where ask = 2;
    Seen seen = 3;
    Introduce introduce = 4;
    Relay relay = 5;
  }
}

// A runtime gives the point the records of some of its ships, each an encoded Whereabouts.
// With each, in the same order, the ship's presence: its signature, by the key that signed
// the record, over a fixed layout that names the ship, the record's time, and a value both
// ends derive from this one connection (see `runtime/src/whereabouts.rs`). So a record is
// kept only from the connection the ship itself is on.
message Announce {
  repeated bytes records = 1;
  repeated bytes presence = 2;
}

// What address does this connection come from, as the point sees it?
message Seen {
}

// A caller asks the point of the ship it wants to call to pass its record to that ship, so
// that the ship sends a few packets toward the caller and opens its router. The caller's own
// record, signed now, and its presence for this connection, as in an announcement.
message Introduce {
  uint64 callee = 1;
  bytes record = 2;
  bytes presence = 3;
}

// A caller that could not reach a ship directly asks that ship's point to carry the two
// ships' packets between them. As in an introduction: the ship wanted, the caller's own record,
// signed now, and its presence for this connection. The point answers with the session the
// packets are to name, or refuses, saying why.
message Relay {
  uint64 callee = 1;
  bytes record = 2;
  bytes presence = 3;
}

// Anyone asks the point where a ship is, by number.
message Where {
  uint64 ship = 1;
}

message WhereReply {
  oneof body {
    Announced announced = 1;
    Found found = 2;
    Saw saw = 3;
    Introduced introduced = 4;
    Relaying relaying = 5;
  }
  // Set, with no body, when the request was not one the point would answer.
  string refused = 15;
}

// For each record announced, in the same order: empty if the point kept it, or why not.
message Announced {
  repeated string outcomes = 1;
}

// The ship's record as the point holds it, or nothing if the point holds none that is still
// good. Whoever asked checks it as if it came from anyone.
message Found {
  bytes record = 1;
}

// The address the point sees the connection coming from: an IPv4 address and port (six
// bytes) or an IPv6 address and port (eighteen), as in a record.
message Saw {
  bytes address = 1;
}

// The caller's record has been passed on to the ship it wants. The point does not wait for
// that ship, and says nothing of what it did.
message Introduced {
}

// The point will carry packets between the caller and the ship it asked for: each is sent to
// the point's port with a short header naming this session (sixteen bytes), and the point sends
// it on, unchanged, to the other ship. The caller's record has been passed to that ship with
// the same session. The point does not wait for that ship.
message Relaying {
  bytes session = 1;
}

// From a lookup point to a ship, on a stream the point opens on the connection the ship
// proved it is on: a caller's record, for the ship named, to send a few packets toward.
// Nothing in it is taken on the point's word: the record is checked as any record is. With a
// session (sixteen bytes), the caller has asked the point to carry its packets to the ship, and
// the ship, if it believes the record, takes packets naming that session from that point as
// coming from the caller, and sends nothing for it.
message Introduction {
  uint64 callee = 1;
  bytes record = 2;
  bytes session = 3;
}

// A call to one method of an interface an agent describes in a proto file of its own (see
// "Describing an agent's interface" in the README). It is the payload of a typed command or
// question. The interface is not here: it is the one the call is made through
// (`Invocation.interface`), which the kernel has already checked. `method` is the method's name
// as written in the description, and `body` its input message, encoded. With `json` set, the
// body is the input written as proto3 JSON, and the reply's body is wanted the same way; the
// agent's own generated code reads and writes it.
message Call {
  string method = 1;
  bytes body = 2;
  bool json = 3;
}

// Why a typed call has no result. Generated dispatch uses `ship.` codes for dispatch faults
// (ship.no-such-interface, ship.no-such-method, ship.not-understood, ship.wrong-kind) and
// prefixes a handler's returned `ship.` code with `app.`. A direct `host.refuse` call supplies
// its own valid code. A question's fault comes back in its `CallReply`. Generated dispatch
// passes a returned command fault to `refuse` (`host.refuse`). An accepted refusal rolls back
// the handler's changes and carries the fault in the owner's result or in a receipt sent to
// another ship (`Receipt.fault`). An invalid code produces an ordinary failure.
message Fault {
  string code = 1;
  string message = 2;
}

// What a typed call hands back: the reply bytes of a typed command or question. `body` is the
// method's output message, encoded, or written as proto3 JSON when the call asked for that.
// `fault` is a question's fault. A command's fault is not put here: the command refuses
// instead, so that nothing it did is kept (see `Fault`).
message CallReply {
  oneof result {
    bytes body = 1;
    Fault fault = 2;
  }
}
