[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
sha2 = "0.10"
wasm-encoder = "0.226"
wasmparser = "0.226"
wasmtime = { version = "31", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
wat = "1"
