[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
libc = "0.2"
# SQLite with every page of the file encrypted (SQLCipher), built with its own copy of
# OpenSSL so that nothing has to be installed on the machine first.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "limits", "serialize"] }
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
stacker = "0.1"
ship-proto = { path = "../proto" }
wasm-encoder = "0.226"
wasmparser = "0.226"
wasmtime = { version = "31", default-features = false, features = ["cranelift", "runtime", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }

[dev-dependencies]
wat = "1"
