[package]
name = "ship-sdk-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Used from an agent's build script, so it is built for the machine doing the build.
[dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
# The canonical proto3 JSON for the generated messages, read and written inside the agent.
pbjson-build = "0.9"
ship-proto = { path = "../proto" }

[dev-dependencies]
# The well-known types the SDK implements, to test the generator's table of their definitions
# against what they encode.
pbjson-types = "0.9"
